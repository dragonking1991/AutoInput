[project]
name = "autoinput"
version = "0.1.0"
description = "Feed Excel/CSV/JSON/XML data into desktop and web data-entry apps"
readme = "docs/architecture.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "platformdirs>=4.2",
    "python-calamine>=0.2",
    "charset-normalizer>=3.3",
    "defusedxml>=0.7",
    "typer>=0.12",
    "rich>=13.7",
    "xlrd>=2.0.1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.7"]  # QtWidgets only; skips ~350 MB of WebEngine/addons
windows = ["pywinauto>=0.6.9; sys_platform == 'win32'", "pynput>=1.7"]
mac = [
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pynput>=1.7",
]
web = ["playwright>=1.45"]

[project.scripts]
autoinput = "autoinput.cli:main"

[project.gui-scripts]
autoinput-gui = "autoinput.ui.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
ui-test = ["pytest-qt>=4.4"]  # needs the `gui` extra
build = ["pyinstaller>=6.11", "pillow>=10.4"]  # packaging/build.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoinput"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# E501: formatter owns line length; RUF001-003: Vietnamese text & typographic dashes are intended
ignore = ["E501", "RUF001", "RUF002", "RUF003", "N818", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"src/autoinput/ui/**" = ["N802"]  # Qt override names

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
