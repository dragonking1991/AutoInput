[[package]]
name = "autoinput"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "charset-normalizer" },
    { name = "defusedxml" },
    { name = "loguru" },
    { name = "platformdirs" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "python-calamine" },
    { name = "pyyaml" },
    { name = "rich" },
    { name = "typer" },
]

[package.optional-dependencies]
gui = [
    { name = "pyside6-essentials" },
]
mac = [
    { name = "pynput" },
    { name = "pyobjc-framework-applicationservices", marker = "sys_platform == 'darwin'" },
    { name = "pyobjc-framework-cocoa", marker = "sys_platform == 'darwin'" },
]
web = [
    { name = "playwright" },
]
windows = [
    { name = "pynput" },
    { name = "pywinauto", marker = "sys_platform == 'win32'" },
]

[package.dev-dependencies]
build = [
    { name = "pillow" },
    { name = "pyinstaller" },
]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "ruff" },
    { name = "types-pyyaml" },
]
ui-test = [
    { name = "pytest-qt" },
]

[package.metadata]
requires-dist = [
    { name = "charset-normalizer", specifier = ">=3.3" },
    { name = "defusedxml", specifier = ">=0.7" },
    { name = "loguru", specifier = ">=0.7" },
    { name = "platformdirs", specifier = ">=4.2" },
    { name = "playwright", marker = "extra == 'web'", specifier = ">=1.45" },
    { name = "pydantic", specifier = ">=2.8" },
    { name = "pydantic-settings", specifier = ">=2.4" },
    { name = "pynput", marker = "extra == 'mac'", specifier = ">=1.7" },
    { name = "pynput", marker = "extra == 'windows'", specifier = ">=1.7" },
    { name = "pyobjc-framework-applicationservices", marker = "sys_platform == 'darwin' and extra == 'mac'", specifier = ">=10" },
    { name = "pyobjc-framework-cocoa", marker = "sys_platform == 'darwin' and extra == 'mac'", specifier = ">=10" },
    { name = "pyside6-essentials", marker = "extra == 'gui'", specifier = ">=6.7" },
    { name = "python-calamine", specifier = ">=0.2" },
    { name = "pywinauto", marker = "sys_platform == 'win32' and extra == 'windows'", specifier = ">=0.6.9" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "rich", specifier = ">=13.7" },
    { name = "typer", specifier = ">=0.12" },
]
provides-extras = ["gui", "windows", "mac", "web"]

[package.metadata.requires-dev]
build = [
    { name = "pillow", specifier = ">=10.4" },
    { name = "pyinstaller", specifier = ">=6.11" },
]
dev = [
    { name = "mypy", specifier = ">=1.11" },
    { name = "pytest", specifier = ">=8" },
    { name = "ruff", specifier = ">=0.6" },
    { name = "types-pyyaml" },
]
ui-test = [{ name = "pytest-qt", specifier = ">=4.4" }]

